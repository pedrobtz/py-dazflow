name: Mutation

# Mutation testing with mutmut (design D46; configuration in pyproject.toml,
# [tool.mutmut]): it mutates core/ (the gate arithmetic included),
# transforms/ and evaluation/, and runs their unit tests (tests/core,
# tests/transforms, tests/evaluation) in file order against every mutant.
# The survivors are listed in the job summary and uploaded as an artefact, to
# be read; .agents/assurance.md says what was done with them.
#
# It runs weekly and on demand, never on a pull request, and gates nothing:
# a survivor is something to read, not a failure.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_PYTHON_DOWNLOADS: automatic
  # The same verdict on every run: hypothesis draws its examples from a fixed seed.
  HYPOTHESIS_PROFILE: mutation

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-extras
      - name: mutmut run
        run: uv run --frozen --all-extras mutmut run --max-children 4
      - name: Survivors
        if: always()
        shell: bash
        run: |
          uv run --frozen --all-extras mutmut results > survivors.txt || true
          {
            echo "## Mutation survivors"
            echo
            echo "Killed and surviving mutants by status:"
            echo
            echo '```'
            uv run --frozen --all-extras mutmut results --all true | awk -F': ' '{print $NF}' | sort | uniq -c || true
            echo '```'
            echo
            echo "Survivors by function:"
            echo
            echo '```'
            grep survived survivors.txt | sed 's/__mutmut_[0-9]*: survived//' | sort | uniq -c | sort -rn || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutmut-survivors
          path: |
            survivors.txt
            mutants/mutmut-stats.json
          if-no-files-found: ignore
