name: Release

# Publishing (design §12, roadmap Stage 15), by trusted publishing: no token is
# stored anywhere.
#   tag v*:            build, then publish to PyPI (environment `pypi`). The tag
#                      must equal `v` + the version in pyproject.toml.
#   workflow_dispatch: build, publish to TestPyPI (environment `testpypi`), then
#                      install that version from TestPyPI into a clean
#                      environment and run `dazflow --version`, `dazflow init`
#                      and `dazflow run`. A dispatch never publishes to PyPI.
#   pull_request:      only when this file changes, the build alone (a dry run).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml"]

# One release at a time per ref; a publish is never cancelled half-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - id: version
        name: Version in pyproject.toml
        shell: bash
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tag names the version
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match version $VERSION in pyproject.toml"
            exit 1
          fi
      - run: uv build
      - run: uv run --frozen --only-group dev twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dazflow/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/dazflow/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  # The uploaded package, installed from TestPyPI (its dependencies from PyPI)
  # into a clean environment, makes and runs a new project.
  testpypi-install:
    needs: [build, testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install dazflow from TestPyPI, then init and run a project
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          uv venv --seed --python 3.13 "$RUNNER_TEMP/env"
          bin="$RUNNER_TEMP/env/bin"
          # TestPyPI's index can take a minute to list a new upload.
          for attempt in 1 2 3 4 5 6; do
            if "$bin/python" -m pip install --no-cache-dir \
                --index-url https://test.pypi.org/simple/ \
                --extra-index-url https://pypi.org/simple/ \
                "dazflow==$VERSION"; then
              break
            fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 30
          done
          printed=$("$bin/dazflow" --version)
          echo "$printed"
          case "$printed" in
            *"$VERSION"*) ;;
            *) echo "::error::dazflow --version printed '$printed', not $VERSION"; exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          "$bin/dazflow" init project
          cd project
          "$bin/dazflow" run
