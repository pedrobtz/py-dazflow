# Great Docs configuration: https://posit-dev.github.io/great-docs/
# The site's home page is README.md; guide pages live in user_guide/.
# Every name in a public module's __all__ belongs to one reference group
# (tests/test_docs.py checks it); an alias such as `ingest.Config` is
# documented under its long name.

display_name: dazflow
parser: numpy
dynamic: true
site_url: https://pedrobtz.github.io/py-dazflow/
github_style: icon

authors:
  - name: pedrobtz
    role: Author
    github: pedrobtz

user_guide:
  - section: Guide
    contents:
      - get-started.qmd
      - command-line.qmd
      - writing-a-plugin.qmd

