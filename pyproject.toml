[project]
name = "dazflow"
version = "0.1.0.dev0"
description = "A time-series modelling workflow whose every step returns tables, figures and findings ready for a model document."
readme = "README.md"
authors = [
    { name = "pedrobtz", email = "pedrobtz@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scipy>=1.13",
    "narwhals>=2.8",
    "statsmodels>=0.14.2",
    "arch>=7.0",
    "pointblank>=0.13",
    "pydantic>=2.8",
    "PyYAML>=6.0.1",
    "great-tables>=0.17",
    "python-docx>=1.1.2",
    "matplotlib>=3.8.4",
    "jinja2>=3.1.4",
    "typer>=0.12.3",
    "rich>=13.7",
]
keywords = ["time series", "forecasting", "econometrics", "model documentation", "stress testing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/pedrobtz/py-dazflow"
Issues = "https://github.com/pedrobtz/py-dazflow/issues"
Changelog = "https://github.com/pedrobtz/py-dazflow/blob/main/CHANGELOG.md"

[project.optional-dependencies]
panel = ["linearmodels>=6.1", "pyfixest>=0.30"]
ml = ["scikit-learn>=1.5", "glum>=3.1"]
# statsforecast 2.0.2 and later cap pandas below 3, and 2.0.1 has wheels for
# Python 3.12 only, so the group stays empty until a release supports pandas 3.
fast = []
# ruptures 1.1.10 declares Python < 3.14 and ships no 3.14 wheels.
breaks = ['ruptures>=1.1.10; python_version < "3.14"']
sensitivity = ["SALib>=1.5"]
cube = ["xarray>=2024.6"]
fetch = ["sdmx1>=2.16", "pandas-datareader>=0.11", "fredapi>=0.5.2"]
io = ["openpyxl>=3.1.3", "SQLAlchemy>=2.0.30", "pyarrow>=16", "polars>=1.0"]
excel = ["xlsxwriter>=3.2"]
credit = ["optbinning>=0.20", "scikit-learn>=1.5"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [".agents", ".github", "CLAUDE.md", "uv.lock", ".python-version", "user_guide"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-randomly>=3.15",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "hypothesis>=6.100",
    "syrupy>=4.6",
    "twine>=6.1",
    "jsonschema>=4.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The design's code blocks are sketches of an API that does not exist yet.
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length is the formatter's job

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
filterwarnings = [
    "error",
    # matplotlib before 3.9 calls pyparsing's camel-case names, which pyparsing
    # 3.3 deprecates; only the lowest-direct job (matplotlib 3.8.4) meets it.
    "ignore:'\\w+' deprecated - use '\\w+':DeprecationWarning",
]
