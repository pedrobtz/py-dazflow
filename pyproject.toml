[project]
name = "dazflow"
version = "0.1.0"
description = "A time-series modelling workflow whose every step returns tables, figures and findings ready for a model document."
readme = "README.md"
authors = [
    { name = "pedrobtz", email = "pedrobtz@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scipy>=1.13",
    "narwhals>=2.8",
    "statsmodels>=0.14.2",
    "arch>=7.0",
    "pointblank>=0.13",
    "pydantic>=2.8",
    "PyYAML>=6.0.1",
    "great-tables>=0.17",
    "python-docx>=1.1.2",
    "matplotlib>=3.8.4",
    "jinja2>=3.1.4",
    "typer>=0.26.0",
    "rich>=13.8",
]
keywords = ["time series", "forecasting", "econometrics", "model documentation", "stress testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]

[project.scripts]
dazflow = "dazflow.cli:main"

[project.urls]
Homepage = "https://github.com/pedrobtz/py-dazflow"
Documentation = "https://pedrobtz.github.io/py-dazflow/"
Issues = "https://github.com/pedrobtz/py-dazflow/issues"
Changelog = "https://github.com/pedrobtz/py-dazflow/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Only the extras 0.1.0 imports; the others of design §12.2 return with the
# stage that uses them (D48).
io = ["openpyxl>=3.1.3", "pyarrow>=16", "polars>=1.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [".agents", ".github", "CLAUDE.md", "uv.lock", ".python-version", "great-docs.yml", "user_guide"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-randomly>=3.15",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "hypothesis>=6.100",
    "syrupy>=4.6",
    "twine>=6.1",
    "jsonschema>=4.21",
    "pytest-xdist>=3.6",
    "mutmut>=3.8.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The design's code blocks are sketches of an API that does not exist yet.
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length is the formatter's job

# Mutation testing (design D46): `uv run --all-extras mutmut run`, then
# `mutmut results`. It runs on a schedule (.github/workflows/mutation.yml) and
# never gates a pull request. mutmut copies the package into mutants/ and runs
# the unit tests of the mutated layers in file order, in one process.
[tool.mutmut]
source_paths = ["src"]
only_mutate = [
    "src/dazflow/core/*",
    "src/dazflow/transforms/*",
    "src/dazflow/evaluation/*",
]
also_copy = ["examples/"]
pytest_add_cli_args = ["-p", "no:randomly", "-p", "no:cacheprovider", "-q"]
pytest_add_cli_args_test_selection = [
    "tests/core",
    "tests/transforms",
    "tests/evaluation",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
filterwarnings = [
    "error",
    # matplotlib before 3.9 calls pyparsing's camel-case names, which pyparsing
    # 3.3 deprecates; only the lowest-direct job (matplotlib 3.8.4) meets it.
    "ignore:'\\w+' deprecated - use '\\w+':DeprecationWarning",
]
